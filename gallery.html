<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>High Noon – Destination Gallery</title>

<style>
body {
    margin: 0;
    background: radial-gradient(#2b1a0f, #0f0703);
    color: #e6c89c;
    font-family: Georgia, serif;
    overflow: hidden;
    touch-action: pan-y;
}

header {
    padding: 10px;
    text-align: center;
}

button {
    background: #3a2617;
    color: #e6c89c;
    border: 1px solid #6b4a2e;
    padding: 6px 14px;
    margin: 4px;
    cursor: pointer;
    border-radius: 6px;
}

button.active {
    background: #6b4a2e;
}

#viewer {
    position: absolute;
    inset: 60px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

#hint {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    opacity: 0.6;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <button onclick="loadSet('base', this)">base</button>
    <button onclick="loadSet('economy', this)">economy</button>
    <button onclick="loadSet('killer', this)">killer</button>
    <button onclick="loadSet('wanted', this)">wanted</button>
</header>

<div id="viewer">
    <img id="image" />
</div>

<div id="hint">Swipe / Arrow keys</div>

<script>
const BASE_URL = "https://kalvx.github.io/highnoon/cards";

let images = [];
let index = 0;

/* ---------- IMAGE LOADING ---------- */

async function loadSet(name, btn) {
    document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");

    const listUrl = `https://raw.githubusercontent.com/kalvx/highnoon/main/cards/${name}/index.txt`;

    const res = await fetch(listUrl);
    const text = await res.text();

    images = text
        .split("\n")
        .map(f => f.trim())
        .filter(f => f.endsWith(".png"))
        .map(f => `${BASE_URL}/${name}/${f}`);

    index = 0;
    show();
}

function show() {
    if (!images.length) return;
    document.getElementById("image").src = images[index];
}

/* ---------- KEYBOARD SUPPORT ---------- */

document.addEventListener("keydown", e => {
    if (!images.length) return;

    if (e.key === "ArrowRight") index = (index + 1) % images.length;
    if (e.key === "ArrowLeft") index = (index - 1 + images.length) % images.length;

    show();
});

/* ---------- TOUCH → ARROW SUPPORT (ANDROID) ---------- */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

const SWIPE_DISTANCE = 40;
const SWIPE_TIME = 600;

document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
}, { passive: true });

document.addEventListener("touchend", e => {
    if (!images.length) return;

    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;

    if (dt > SWIPE_TIME) return;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_DISTANCE) {
        if (dx > 0) {
            index = (index - 1 + images.length) % images.length; // swipe right = previous
        } else {
            index = (index + 1) % images.length; // swipe left = next
        }
        show();
    }
});

/* ---------- AUTO LOAD ---------- */
loadSet("base");
</script>

</body>
</html>
