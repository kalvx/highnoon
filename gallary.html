<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>High Noon – Destination Gallery</title>
<style>
  body {
    margin: 0;
    background: #0e0b07;
    color: #f2e6c9;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }
  header {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1b140c;
    overflow-x: auto;
    white-space: nowrap;
  }
  header button {
    background: #2b2114;
    color: #f2e6c9;
    border: 1px solid #4b3a22;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  header button.active {
    background: #6b4f2a;
  }
  #viewer {
    height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #strip {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease;
  }
  .card {
    min-width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<header id="cats"></header>
<div id="viewer">
  <div id="strip"></div>
</div>

<script>
let data = {};
let currentCat = null;
let index = 0;
let startX = 0;

fetch('cards.json')
  .then(r => r.json())
  .then(json => {
    data = json;
    const cats = document.getElementById('cats');
    Object.keys(data).forEach((cat, i) => {
      const b = document.createElement('button');
      b.textContent = cat;
      b.onclick = () => loadCat(cat);
      cats.appendChild(b);
      if (i === 0) loadCat(cat);
    });
  });

function loadCat(cat) {
  currentCat = cat;
  index = 0;
  document.querySelectorAll('header button').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  data[cat].forEach(path => {
    const d = document.createElement('div');
    d.className = 'card';
    const img = document.createElement('img');
    img.src = encodeURI(path);
    d.appendChild(img);
    strip.appendChild(d);
  });
  update();
}

function update() {
  document.getElementById('strip').style.transform =
    `translateX(${-index * window.innerWidth}px)`;
}

// Touch swipe
document.getElementById('viewer').addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});
document.getElementById('viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (dx < -40 && index < data[currentCat].length - 1) index++;
  if (dx > 40 && index > 0) index--;
  update();
});

// Resize safety
window.addEventListener('resize', update);
</script>

</body>
</html>
